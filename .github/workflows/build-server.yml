name: Build Server

on:
  push:
    branches:
      - master
      - agents/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build server jar
        run: mvn -pl gms-server --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: BeiDou-server
          path: gms-server/target/BeiDou.jar
          if-no-files-found: error
          retention-days: 14
